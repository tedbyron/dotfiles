name: Cache

# Updates flake.lock, builds every host, and pushes them to Cachix. The lock
# is committed only if every host built.

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: cache
  cancel-in-progress: false

env:
  CACHIX_NAME: tedbyron
  # Don't push downloads, vendored dependencies or debug outputs: hosts only
  # need build outputs, and these were over half of what a run pushed. Paths
  # in another pushed path's closure are still pushed.
  PUSH_FILTER: '(-source|-source-patched|-npm-deps|-go-modules|-debug|\.(run|dmg|zip|tgz|deb|distro|tar(\.[a-z0-9]+)?))$'

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config:
            experimental-features = nix-command flakes pipe-operators
      - run: nix flake update
      - uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  # Slow to build, so build it once per platform before the hosts, which then
  # pull it from Cachix.
  curlio:
    needs: lock
    strategy:
      matrix:
        include:
          - runner: macos-latest
            system: aarch64-darwin
            attr: packages.aarch64-darwin.curlio-ttf
          - runner: ubuntu-latest
            system: x86_64-linux
            attr: packages.x86_64-linux.curlio-ttf
    name: curlio (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config:
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: ${{ env.PUSH_FILTER }}
      - run: nix build --print-build-logs --no-link .#${{ matrix.attr }}

  build:
    needs: [lock, curlio]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: teds-laptop
            runner: macos-latest
            attr: darwinConfigurations.teds-laptop.system
          - host: teds-mac-mini
            runner: macos-latest
            attr: darwinConfigurations.teds-mac-mini.system
          - host: teds-work-laptop
            runner: macos-latest
            attr: darwinConfigurations.teds-work-laptop.system
          - host: teds-desktop
            runner: ubuntu-latest
            attr: nixosConfigurations.teds-desktop.config.system.build.toplevel
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
      # Skips itself on macOS, which has enough space.
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config:
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: ${{ env.PUSH_FILTER }}
          extraPullNames: nix-community
      - run: nix build --print-build-logs --no-link .#${{ matrix.attr }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
      - run: |
          git diff --quiet flake.lock && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update flake' flake.lock
          git pull --rebase
          git push
